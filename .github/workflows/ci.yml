name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub-hosted CPython. This is not a Hexagon / Copilot+ runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          python -c "from pathlib import Path; assert list(Path('dist').glob('*.whl')) and list(Path('dist').glob('*.tar.gz'))"
