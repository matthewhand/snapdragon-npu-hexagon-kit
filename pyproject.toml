[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapdragon-npu-hexagon-kit"
version = "0.2.0"
description = "Shared Hexagon NPU model cache, catalog, and preflight for first-generation Copilot+ PCs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Matthew Hand" }]
keywords = ["snapdragon", "hexagon", "npu", "copilot+", "onnxruntime", "qnn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ort = ["onnxruntime>=1.20"]
hub = ["qai_hub_models_cli>=0.50", "huggingface_hub>=0.23"]
hf = ["huggingface_hub>=0.23"]
apps = ["qai-hub-apps"]
sdk = ["qai-hub"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
hexagon = "hexagon_kit.cli:main"

[project.urls]
Homepage = "https://github.com/matthewhand/snapdragon-npu-hexagon-kit"
Repository = "https://github.com/matthewhand/snapdragon-npu-hexagon-kit"
Issues = "https://github.com/matthewhand/snapdragon-npu-hexagon-kit/issues"
Changelog = "https://github.com/matthewhand/snapdragon-npu-hexagon-kit/blob/main/CHANGELOG.md"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hexagon_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
